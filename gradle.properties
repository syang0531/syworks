org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Minecraft / NeoForge
# 26.2 requires Java 25 (same stack as the sibling placitum mod so both load together).
minecraft_version=26.2
minecraft_version_range=[26.2,26.3)
neo_version=26.2.0.88
neo_version_range=[26.2.0,)
loader_version_range=[4,)

# Parchment mappings are not published for 26.2 yet. Re-enable the block in
# build.gradle once https://maven.parchmentmc.org/org/parchmentmc/data/parchment-26.2/ exists.
# parchment_minecraft_version=26.2
# parchment_mappings_version=

# Mod metadata
mod_id=syalchemy
mod_name=SY Alchemy
mod_license=MIT
mod_version=0.3.0
mod_group_id=com.syang.syalchemy
mod_authors=syang
# Keep this file pure ASCII. Gradle reads .properties as ISO-8859-1, so a non-ASCII
# character here lands mangled in neoforge.mods.toml and shows up in the mod list.
mod_description=SY Alchemy - extract metals from vanilla blocks and forge them into alloy equipment.
mod_homepage=https://www.curseforge.com/minecraft/mc-mods/syalchemy

# CurseForge - numeric project ID from the mod's CurseForge page (set after registering the project).
curseforge_project_id=1604711
